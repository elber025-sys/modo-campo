<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Modo Campo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#172033}header{height:58px;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between}#map{height:calc(100vh - 58px)}.panel{position:fixed;z-index:1000;left:10px;top:70px;width:min(330px,calc(100vw - 20px));background:white;border:1px solid #ccd6e0;border-radius:12px;padding:12px;box-shadow:0 6px 22px #0002}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 10px;font-weight:700;cursor:pointer}.pri{background:#0f766e;color:white}.sec{background:#eef2f7}.status{font-size:12px;margin:8px 0}.hide{display:none}input[type=file]{width:100%;font-size:12px}.badge{padding:5px 8px;border-radius:20px;background:#eef2f7;font-size:12px}.offline{background:#fff3cd}.marker{background:#b91c1c;color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 1px 5px #0006}</style></head><body>
<header><b>📲 Demandas Operacionais — Modo Campo</b><span id="net" class="badge">...</span></header><div id="map"></div>
<div class="panel"><b>Pacote de campo</b><div id="info" class="status">Nenhum pacote importado.</div><input id="file" type="file" accept="application/json,.json"><div class="row" style="margin-top:8px"><button class="btn pri" id="importar">📂 Importar backup</button><button class="btn sec" id="gps">📍 Minha localização</button><button class="btn sec" id="tiles">⬇️ Preparar mapa visível</button></div><div class="status">Depois de abrir esta PWA uma vez com internet e preparar a área, ela poderá ser aberta novamente pelo ícone instalado, mesmo sem conexão.</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([-19.45,-44.25],9);const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let group=L.layerGroup().addTo(map), dados=[];
function net(){const e=document.getElementById('net');e.textContent=navigator.onLine?'● Online':'● Offline';e.className='badge '+(navigator.onLine?'':'offline')}addEventListener('online',net);addEventListener('offline',net);net();
function key(d){return String(d.codigo||d.geocod||d.GEOCOD_IEF||'')}
function render(){group.clearLayers();const pts=[];dados.forEach(d=>{const lat=Number(d.lat??d.latitude),lon=Number(d.lon??d.lng??d.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;pts.push([lat,lon]);const m=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="marker">•</div>',iconSize:[28,28],iconAnchor:[14,14]})});m.bindPopup('<b>'+key(d)+'</b><br>'+(d.municipio||'')+'<br>'+(d.natureza||d.tipo||''));m.addTo(group)});if(pts.length)map.fitBounds(pts,{padding:[25,25],maxZoom:15});document.getElementById('info').textContent=dados.length+' demanda(s) disponíveis offline.'}
function extrair(o){if(Array.isArray(o))return o;if(Array.isArray(o.registros))return o.registros;if(o.payload&&Array.isArray(o.payload.registros))return o.payload.registros;if(Array.isArray(o.demandas))return o.demandas;if(Array.isArray(o.operacoes)){const a=[];o.operacoes.forEach(x=>(x.demandasOriginais||[]).forEach(d=>a.push(d)));return a}return []}
document.getElementById('importar').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return alert('Escolha o arquivo JSON de backup.');try{const o=JSON.parse(await f.text());dados=extrair(o);localStorage.setItem('CAMPO_PACOTE',JSON.stringify({salvoEm:new Date().toISOString(),dados}));render()}catch(e){alert('Não foi possível importar: '+e.message)}};
try{const c=JSON.parse(localStorage.getItem('CAMPO_PACOTE')||'null');if(c&&Array.isArray(c.dados)){dados=c.dados;render()}}catch(_){ }
document.getElementById('gps').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],16),e=>alert('Localização indisponível: '+e.message),{enableHighAccuracy:true,timeout:15000}):alert('GPS não disponível.');
document.getElementById('tiles').onclick=async()=>{if(!navigator.onLine)return alert('Conecte-se à internet para preparar o mapa.');const z0=Math.max(8,map.getZoom()-1),z1=Math.min(17,map.getZoom()+2),b=map.getBounds(),urls=[];function tx(lon,z){return Math.floor((lon+180)/360*2**z)}function ty(lat,z){lat=Math.max(-85.0511,Math.min(85.0511,lat));return Math.floor((1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*2**z)}for(let z=z0;z<=z1;z++){let x1=tx(b.getWest(),z),x2=tx(b.getEast(),z),y1=ty(b.getNorth(),z),y2=ty(b.getSouth(),z);for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`)}if(urls.length>800)return alert('Área muito grande ('+urls.length+' partes). Aproxime o mapa.');const c=await caches.open('campo-tiles-v1');let ok=0;for(const u of urls){try{if(!(await c.match(u))){const r=await fetch(u);if(r.ok)await c.put(u,r.clone())}ok++}catch(_){}}alert('Mapa preparado: '+ok+' de '+urls.length+' partes salvas.')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
